[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dinie-sdk"
version = "1.1.0"
description = "Official Python SDK for the Dinie V3 API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx", "ruff", "mypy", "build"]

[tool.dinie]
api_version = "2026-03-01"

# C-COLO-1: py.typed must ship in the wheel so downstream type-checkers recognise
# this as a typed package (PEP 561). hatchling includes all files inside the package
# directory; force-include makes the intent explicit and guards against future
# filter rules accidentally stripping the marker.
[tool.hatch.build.targets.wheel]
packages = ["dinie"]

[tool.hatch.build.targets.wheel.force-include]
"dinie/py.typed" = "dinie/py.typed"

# ── Type checking ─────────────────────────────────────────────────────────────
# C-COLO-5: this block is the canonical mypy config for sdk-python.
# story 005 (sdk-generator fixtures/configs/mypy.ini) must mirror these settings.
[tool.mypy]
strict = true
python_version = "3.10"

# ── Linting / formatting ──────────────────────────────────────────────────────
# C-COLO-5: this block is the canonical ruff config for sdk-python.
# story 005 (sdk-generator fixtures/configs/ruff.toml) must mirror these settings.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated files may contain long docstring lines from OpenAPI descriptions.
# E501 is silenced here — the source of truth is the spec, not line length.
"dinie/generated/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
